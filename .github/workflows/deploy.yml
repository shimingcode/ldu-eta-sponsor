name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: 检查与构建
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: TypeScript 检查
        run: npm run typecheck
      - name: 代码检查
        run: npm run lint
      - name: 单元测试
        run: npm run test
      - name: 构建静态站点
        run: npm run build
      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: 发布站点
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
